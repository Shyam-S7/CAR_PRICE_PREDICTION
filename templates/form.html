<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Car Price Prediction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url("{{url_for('static',filename='form.jpg')}}");
            background-size: cover;
            background-position: center;
            padding: 40px;
        }

        .container {
            max-width: 800px;  /* wider for 2 columns */
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        form {
            display: grid;
            grid-template-columns: 1fr 1fr; /* 2 columns */
            gap: 15px 20px; /* row gap and column gap */
        }

        label {
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
        }

        select,
        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .full-width {
            grid-column: span 2; /* makes element stretch across both columns */
        }

        input[type="submit"] {
            background: #007BFF;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            padding: 12px;
        }

        input[type="submit"]:hover {
            background: #0056b3;
        }
    </style>

    <script>
        function updateModels() {
            let brand = document.getElementById("brand").value;
            let models = {{ models_dict | tojson | safe }};
            let modelSelect = document.getElementById("model_name");
            modelSelect.innerHTML = "";
            for (let i = 0; i < models[brand].length; i++) {
                let opt = document.createElement("option");
                opt.value = models[brand][i];
                opt.innerHTML = models[brand][i];
                modelSelect.appendChild(opt);
            }
        }
    </script>
</head>

<body>
    <div class="container">
        <h1>Car Price Prediction</h1>
        <form action="/predict" method="post">

            <div>
                <label for="brand">Brand:</label>
                <select name="brand" id="brand" onchange="updateModels()">
                    {% for b in brands %}
                    <option value="{{ b }}">{{ b }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label for="model_name">Model:</label>
                <select name="model_name" id="model_name">
                    {% for m in models_dict[brands[0]] %}
                    <option value="{{ m }}">{{ m }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label for="color">Color:</label>
                <select name="color">
                    {% for c in colors %}
                    <option value="{{ c }}">{{ c }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label for="year">Year:</label>
                <select name="year">
                    {% for y in years %}
                    <option value="{{ y }}">{{ y }}</option>
                    {% endfor %}
                </select>
            </div>

            

            <div>
                <label for="transmission">Transmission:</label>
                <select name="transmission">
                    {% for t in transmissions %}
                    <option value="{{ t }}">{{ t }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label for="fuel_type">Fuel Type:</label>
                <select name="fuel_type">
                    {% for f in fuel_types %}
                    <option value="{{ f }}">{{ f }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label for="power_ps">Power PS:</label>
                <input type="number" name="power_ps" min="0" max="2200" step="0.01" required>
            </div>
            
            <div>
                <label for="fuel_100km">Fuel per 100 km (L):</label>
                <input type="number" name="fuel_100km" min="1" max="25" step="0.01" required>
            </div>

            <div>
                <label for="fuel_g_km">Fuel g/km:</label>
                <input type="number" name="fuel_g_km" min="0" max="500" step="0.01" required>
            </div>

            <div>
                <label for="mileage">Mileage (km):</label>
                <input type="number" name="mileage" min="0" max="5000000" step="0.01" required>
            </div>

            <div class="full-width">
                <input type="submit" value="Predict">
            </div>
        </form>
    </div>
</body>

</html>
